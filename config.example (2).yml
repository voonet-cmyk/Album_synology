# Configuration personnelle — NE PAS PARTAGER

synology:
  host: "http://192.168.X.X"
  port: 5000
  username: "script_user"
  password: "your_password"
  # otp_secret: "XXXX"

album:
  name_prefix: "Album du jour"
  photo_count: 50
  share_with: "user1,user2,user3"

cache:
  # Reconstruit l'index si le cache a plus de N heures
  max_age_hours: 24
  # Passe à true pour forcer la reconstruction au prochain lancement
  force_refresh: false

themes:
  rotation: "anniversary,season,random"
  anniversary_years_back: "1,2,3,5,10"
  exclude_paths: "19*,VHS*,MobileBackup,iphone*,200700*"
  no_repeat_days_anniversary: 30
  no_repeat_days_season: 30
  no_repeat_days_random: 30

logs:
  retention_days: 30
  level: "INFO"
